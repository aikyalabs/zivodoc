name: Deploy Chat Widget

on:
  push:
    branches: [main]
    paths:
      - 'packages/chat-widget/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-chat-widget.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build widget bundle
        run: pnpm --filter @zivodoc/chat-widget build

      - name: Stage bundle as chat.js
        run: |
          mkdir -p packages/chat-widget/public
          cp packages/chat-widget/dist/chat.global.js packages/chat-widget/public/chat.js
          cp packages/chat-widget/dist/chat.global.js.map packages/chat-widget/public/chat.js.map

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy packages/chat-widget/public --project-name=zivodoc-cdn --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
