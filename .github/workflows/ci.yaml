name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yaml'

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saas_template_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @zivodoc/shared build

      - name: Lint
        run: pnpm lint

      - name: Build API & Web
        run: |
          pnpm --filter @zivodoc/api build &
          pnpm --filter @zivodoc/web build &
          wait

      - name: Run API migrations
        run: pnpm --filter @zivodoc/api migration:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/saas_template_test

      - name: Test API & Web
        run: |
          pnpm --filter @zivodoc/api test:e2e &
          pnpm --filter @zivodoc/web test -- --run &
          wait
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/saas_template_test
