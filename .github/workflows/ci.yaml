name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      landing: ${{ steps.filter.outputs.landing }}
      widget: ${{ steps.filter.outputs.widget }}
      scanner: ${{ steps.filter.outputs.scanner }}
      shared: ${{ steps.filter.outputs.shared }}
      any-code: ${{ steps.filter.outputs.any-code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - '.github/workflows/ci.yaml'
              - '.github/actions/setup/**'
            shared: &shared
              - *workspace
              - 'packages/shared/**'
            scanner: &scanner
              - *shared
              - 'packages/scanner/**'
            api:
              - *scanner
              - 'apps/api/**'
            web:
              - *shared
              - 'apps/web/**'
            widget:
              - *shared
              - 'packages/chat-widget/**'
            landing:
              - *workspace
              - 'apps/landing/**'
            any-code:
              - *workspace
              - 'apps/**'
              - 'packages/**'

  format-check:
    name: Prettier
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any-code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  build-shared:
    name: Build shared
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zivodoc/shared build

  build-scanner:
    name: Build scanner
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scanner == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo build --filter=@zivodoc/scanner

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo build --filter=@zivodoc/api

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo build --filter=@zivodoc/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  build-landing:
    name: Build landing
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo build --filter=@zivodoc/landing
        env:
          PUBLIC_APP_URL: https://app.zivodoc.com
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

  build-widget:
    name: Build widget
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo build --filter=@zivodoc/chat-widget

  test-scanner:
    name: Test scanner
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scanner == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Get installed Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright (browsers + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm --filter @zivodoc/scanner test

  test-web:
    name: Test web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zivodoc/web test -- --run

  ci_pass:
    name: CI pass
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - format-check
      - build-shared
      - build-scanner
      - build-api
      - build-web
      - build-landing
      - build-widget
      - test-scanner
      - test-web
    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          fail=0
          for job in format-check build-shared build-scanner build-api build-web build-landing build-widget test-scanner test-web; do
            result=$(echo "$RESULTS" | jq -r ".[\"$job\"].result")
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$job failed (result=$result)"
              fail=1
            fi
          done
          exit $fail

  deploy-landing:
    name: Deploy landing
    runs-on: ubuntu-latest
    needs: [changes, ci_pass]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.ci_pass.result == 'success' &&
      needs.changes.outputs.landing == 'true'
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zivodoc/landing build
        env:
          PUBLIC_APP_URL: https://app.zivodoc.com
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - run: npx wrangler pages deploy apps/landing/dist --project-name=zivodoc --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    needs: [changes, ci_pass]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.ci_pass.result == 'success' &&
      needs.changes.outputs.web == 'true'
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zivodoc/shared build
      - run: pnpm --filter @zivodoc/web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - run: npx wrangler pages deploy apps/web/dist --project-name=zivodoc-app --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-widget:
    name: Deploy widget
    runs-on: ubuntu-latest
    needs: [changes, ci_pass]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.ci_pass.result == 'success' &&
      needs.changes.outputs.widget == 'true'
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zivodoc/chat-widget build
      - name: Stage bundle as chat.js
        run: |
          mkdir -p packages/chat-widget/public
          cp packages/chat-widget/dist/chat.global.js packages/chat-widget/public/chat.js
          cp packages/chat-widget/dist/chat.global.js.map packages/chat-widget/public/chat.js.map
      - run: npx wrangler pages deploy packages/chat-widget/public --project-name=zivodoc-cdn --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [changes, ci_pass]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.ci_pass.result == 'success' &&
      needs.changes.outputs.api == 'true'
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK_API: ${{ secrets.DOKPLOY_WEBHOOK_API }}
        if: env.DOKPLOY_WEBHOOK_API != ''
        run: |
          curl -f -X POST "$DOKPLOY_WEBHOOK_API" \
            -H "Content-Type: application/json" \
            --max-time 30 || echo "Dokploy webhook failed (non-fatal)"
