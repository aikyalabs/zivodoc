name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      landing: ${{ steps.filter.outputs.landing }}
      widget: ${{ steps.filter.outputs.widget }}
      scanner: ${{ steps.filter.outputs.scanner }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'packages/scanner/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yaml'
            landing:
              - 'apps/landing/**'
              - '.github/workflows/ci.yaml'
            widget:
              - 'packages/chat-widget/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yaml'
            scanner:
              - 'packages/scanner/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'

  ci:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.widget == 'true' ||
      needs.changes.outputs.scanner == 'true' ||
      needs.changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build

      - name: Install Playwright browser
        if: needs.changes.outputs.scanner == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Test scanner
        if: needs.changes.outputs.scanner == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter @zivodoc/scanner test

      - name: Test web
        if: needs.changes.outputs.web == 'true'
        run: pnpm --filter @zivodoc/web test -- --run
        continue-on-error: true

  deploy-landing:
    runs-on: ubuntu-latest
    needs: [changes, ci]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.landing == 'true' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build landing
        run: pnpm --filter @zivodoc/landing build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/landing/dist --project-name=zivodoc --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: [changes, ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.web == 'true' &&
      needs.ci.result == 'success'
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @zivodoc/shared build

      - name: Build web dashboard
        run: pnpm --filter @zivodoc/web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name=zivodoc-app --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-widget:
    runs-on: ubuntu-latest
    needs: [changes, ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.widget == 'true' &&
      needs.ci.result == 'success'
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build chat widget
        run: pnpm --filter @zivodoc/chat-widget build

      - name: Stage bundle as chat.js
        run: |
          mkdir -p packages/chat-widget/public
          cp packages/chat-widget/dist/chat.global.js packages/chat-widget/public/chat.js
          cp packages/chat-widget/dist/chat.global.js.map packages/chat-widget/public/chat.js.map

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy packages/chat-widget/public --project-name=zivodoc-cdn --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    runs-on: ubuntu-latest
    needs: [changes, ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.api == 'true' &&
      needs.ci.result == 'success'
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK_API: ${{ secrets.DOKPLOY_WEBHOOK_API }}
        if: env.DOKPLOY_WEBHOOK_API != ''
        run: |
          curl -f -X POST "$DOKPLOY_WEBHOOK_API" \
            -H "Content-Type: application/json" \
            --max-time 30 || echo "Dokploy webhook failed (non-fatal)"
