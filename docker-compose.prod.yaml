services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: zivodoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zivodoc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zivodoc
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - zivodoc
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/zivodoc
      CORS_HOSTS: ${CORS_HOSTS:-http://localhost:8080}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zivodoc
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - zivodoc
    restart: unless-stopped

networks:
  zivodoc:
    driver: bridge

volumes:
  db_data:
  redis_data:
